<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ESTRA LINK">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="ESTRA LINK — Plateforme éducative : apprendre, partager et progresser ensemble.">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ESTRA LINK — Ouverture</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23f97316'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23f97316'/%3E%3C/svg%3E">

    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --text: #0f172a;
            --text-muted: #475569;
            --title: #ea580c;
            --title-shadow: rgba(249, 115, 22, 0.22);
            --cloud-from: #0284c7;
            --cloud-to: #7c3aed;
            --cloud-shadow: rgba(2, 132, 199, 0.3);
            --cloud-ground: rgba(2, 132, 199, 0.25);
            --silhouette-opacity: 0.12;
            --stripe-blue: rgba(0, 127, 255, 0.03);
            --stripe-yellow: rgba(247, 214, 24, 0.03);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #0f172a;
                --text: #f1f5f9;
                --text-muted: #94a3b8;
                --title: #fb923c;
                --title-shadow: rgba(251, 146, 60, 0.32);
                --cloud-from: #38bdf8;
                --cloud-to: #a78bfa;
                --cloud-shadow: rgba(56, 189, 248, 0.35);
                --cloud-ground: rgba(56, 189, 248, 0.3);
                --silhouette-opacity: 0.14;
                --stripe-blue: rgba(56, 189, 248, 0.05);
                --stripe-yellow: rgba(247, 214, 24, 0.05);
            }
        }

        @media (prefers-contrast: more) {
            :root {
                --text-muted: #334155;
                --cloud-shadow: rgba(0, 0, 0, 0.5);
            }
            @media (prefers-color-scheme: dark) {
                :root { --text-muted: #e2e8f0; }
            }
        }

        /* ============================================================
           RESET / BASE
           ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Google Sans', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--bg);
            color: var(--text);
            background-image:
                repeating-linear-gradient(
                    45deg,
                    var(--stripe-blue) 0px,
                    var(--stripe-blue) 2px,
                    transparent 2px,
                    transparent 10px
                ),
                repeating-linear-gradient(
                    -45deg,
                    var(--stripe-yellow) 0px,
                    var(--stripe-yellow) 2px,
                    transparent 2px,
                    transparent 10px
                );
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
            overflow: hidden;
        }

        :where(a, button, [tabindex]):focus-visible {
            outline: 2px solid var(--cloud-from);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            background: var(--cloud-from);
            color: #fff;
            padding: 10px 16px;
            z-index: 100000;
            font-weight: 600;
            border-radius: 4px;
            text-decoration: none;
        }
        .skip-link:focus { left: 8px; top: 8px; }

        /* ============================================================
           SPLASH SCREEN
           ============================================================ */
        .splash-screen {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ============================================================
           BLOC HAUT
           ============================================================ */
        .splash-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ============================================================
           NUAGE
           ============================================================ */
        .cloud-wrapper {
            position: relative;
            width: clamp(90px, 20vw, 140px);
            height: clamp(60px, 13vw, 95px);
            margin-bottom: clamp(20px, 4vw, 36px);
            animation: floatCloud 3s ease-in-out infinite;
        }

        .cloud-wrapper::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 15px;
            background: radial-gradient(ellipse, var(--cloud-ground), transparent 70%);
            filter: blur(6px);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes floatCloud {
            0%, 100% { transform: translateY(0px); }
            50%      { transform: translateY(-8px); }
        }

        .cloud {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cloud-piece {
            position: absolute;
            background: linear-gradient(145deg, var(--cloud-from), var(--cloud-to));
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.5);
            animation: pieceAppear 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 8px 32px var(--cloud-shadow);
        }

        .piece-1 {
            width: 40%;
            height: 60%;
            top: 20%;
            left: 0;
            animation-delay: 0.1s;
        }
        .piece-2 {
            width: 43%;
            height: 65%;
            top: 12%;
            right: 0;
            animation-delay: 0.3s;
        }
        .piece-3 {
            width: 32%;
            height: 48%;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            animation: pieceAppearCenter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
        }
        .piece-4 {
            width: 75%;
            height: 50%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            border-radius: 40px 40px 20px 20px;
            background: linear-gradient(145deg, var(--cloud-from), var(--cloud-to));
            animation: pieceAppearBase 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards;
            box-shadow: 0 8px 32px var(--cloud-shadow);
        }

        @keyframes pieceAppear {
            0%   { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pieceAppearCenter {
            0%   { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }
        @keyframes pieceAppearBase {
            0%   { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .rdc-silhouette {
            position: absolute;
            width: 42%;
            height: 62%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            fill: #ffffff;
            opacity: 0;
            animation: fadeInSilhouette 1.2s ease 0.8s forwards;
        }

        @keyframes fadeInSilhouette {
            to { opacity: var(--silhouette-opacity); }
        }

        /* ============================================================
           TITRE
           ============================================================ */
        .app-title {
            font-size: clamp(1.8rem, 1.2rem + 3vw, 3.4rem);
            font-weight: 900;
            color: var(--title);
            letter-spacing: clamp(2px, 0.5vw + 1px, 6px);
            margin-bottom: clamp(6px, 1vw, 10px);
            opacity: 0;
            animation: titleFade 0.8s ease 0.9s forwards;
            text-shadow: 0 4px 20px var(--title-shadow);
            line-height: 1.1;
            text-align: center;
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: clamp(0.6rem, 0.5rem + 0.3vw, 0.8rem);
            font-weight: 400;
            letter-spacing: clamp(2px, 0.3vw + 1px, 4px);
            text-transform: uppercase;
            opacity: 0;
            animation: titleFade 0.8s ease 1.1s forwards;
            text-align: center;
        }

        @keyframes titleFade {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           POINTS DE CHARGEMENT
           ============================================================ */
        .loading-dots {
            position: absolute;
            bottom: max(18vh, calc(18dvh + env(safe-area-inset-bottom)));
            left: 0;
            right: 0;
            display: flex;
            gap: clamp(10px, 2vw, 16px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: titleFade 0.6s ease 1.3s forwards;
        }

        .loading-dots span {
            display: block;
            width: clamp(14px, 3vw, 20px);
            height: clamp(14px, 3vw, 20px);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) { background: #007fff; }
        .loading-dots span:nth-child(2) { background: #f7d618; animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { background: #ce1021; animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.6; }
            40%           { transform: scale(1.5); opacity: 1; }
        }

        /* ============================================================
           GRANDS ÉCRANS (1440+, 1920+, 2560+)
           ============================================================ */
        @media (min-width: 1440px) {
            .cloud-wrapper { margin-bottom: 44px; }
            .loading-dots { bottom: max(14vh, calc(14dvh + env(safe-area-inset-bottom))); }
        }

        @media (min-width: 1920px) {
            html { font-size: 17px; }
            .app-title { font-size: clamp(2.8rem, 3.2vw, 4rem); letter-spacing: 8px; }
            .app-subtitle { font-size: 0.85rem; letter-spacing: 5px; }
            .cloud-wrapper { width: 160px; height: 110px; }
        }

        @media (min-width: 2560px) {
            html { font-size: 18px; }
            .app-title { font-size: 4.6rem; letter-spacing: 10px; }
            .cloud-wrapper { width: 200px; height: 140px; }
            .loading-dots span { width: 24px; height: 24px; }
        }

        /* ============================================================
           PETITS ÉCRANS
           ============================================================ */
        @media (max-width: 480px) {
            .cloud-wrapper { margin-bottom: 20px; }
            .loading-dots { bottom: max(15vh, calc(15dvh + env(safe-area-inset-bottom))); }
        }

        /* ============================================================
           LANDSCAPE (hauteur limitée)
           ============================================================ */
        @media (max-height: 500px) and (orientation: landscape) {
            .cloud-wrapper {
                margin-bottom: 12px;
                width: 70px;
                height: 50px;
            }
            .app-title { font-size: clamp(1.4rem, 4vh, 2rem); }
            .app-subtitle { font-size: 0.6rem; }
            .loading-dots {
                bottom: max(10vh, calc(10dvh + env(safe-area-inset-bottom)));
            }
        }

        /* ============================================================
           MOTION REDUITE
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            .cloud-piece,
            .app-title,
            .app-subtitle,
            .rdc-silhouette,
            .loading-dots {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                opacity: 1 !important;
            }
            .cloud-piece,
            .rdc-silhouette {
                transform: none !important;
            }
            .piece-3,
            .piece-4 {
                transform: translateX(-50%) !important;
            }
            .cloud-wrapper { animation: none !important; }
            .loading-dots span {
                animation: none !important;
                opacity: 0.75 !important;
            }
            .splash-screen { animation: none !important; }
        }
    </style>
</head>
<body>
    <a href="#splash-content" class="skip-link">Aller au contenu</a>

    <main class="splash-screen" id="splash-content" role="status" aria-live="polite" aria-label="Chargement d'ESTRA LINK">

        <div class="splash-top">
            <div class="cloud-wrapper" aria-hidden="true">
                <div class="cloud">
                    <div class="cloud-piece piece-1"></div>
                    <div class="cloud-piece piece-2"></div>
                    <div class="cloud-piece piece-3"></div>
                    <div class="cloud-piece piece-4"></div>
                    <svg class="rdc-silhouette" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                        <path d="M256 32C163.2 32 88 107.2 88 200c0 112 168 280 168 280s168-168 168-280C424 107.2 348.8 32 256 32zm0 368c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <h1 class="app-title">ESTRA LINK</h1>
            <p class="app-subtitle">Plateforme éducative</p>
        </div>

        <div class="loading-dots" aria-label="Chargement en cours">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>
