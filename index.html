<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="accueil.html">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .contenaire{
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px 10px;
            margin: 13%;
            width: 60%px;
            height: 350px;
            border: double white;
            background-color: aquamarine;
        }
        body{
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        label{
            font-family: 'Times New Roman', Times, serif;
            font-size: 2rem;
            font-weight: 600;
        }
        p{
            font-size: 1.5rem;
            padding: 20px 20px;
        }
        .button{
            margin: 50px;
        }
        
        a{
            background-color: cadetblue;
            color: azure;
            padding: 13px;
            text-decoration: none;
            font-size: 15px;
            border-radius: 15px;
        }
        form{
            margin: 40px;
        }
         @media (max-width: 600px) {
            .contenaire{
                height: 550px;
                margin: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="contenaire">
        <div class="form">
        <form action="accueil.html"></form>
        <label for="">Bienvenu dans mon univers !</label>
        <p>Nous mettons la technologie au service de vos idées. Ici, l'Innovation rencontre la passion, rejoignez-nous dans cette aventure numeirque !   Suivez mon parcours et découvrez mes réalisations.</p>
        <div class="button">
            <a href="accueil.html">Page suivant ==></a>
        </div>
    </div>
    </div>
</body>
</html>
